# OPTIONEEL (stap 6 in de README): elke push naar GitHub start automatisch een PipelineRun.
#
#   GitHub --webhook--> EventListener --> TriggerBinding (haalt url/commit uit de JSON)
#                                     --> TriggerTemplate (maakt de PipelineRun)
#
# Vooraf aanmaken (zelfde geheim invullen bij de webhook in GitHub):
#   oc create secret generic github-webhook-secret --from-literal=secretToken=<zelfbedacht-geheim>
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: hello-ci-template
spec:
  params:
    - name: git-url
    - name: revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: hello-ci-push-
      spec:
        pipelineRef:
          name: hello-ci
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: revision
            value: $(tt.params.revision)
        taskRunTemplate:
          serviceAccountName: pipeline
        workspaces:
          - name: ws
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: hello-listener
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value: [push]
      bindings:
        - ref: github-push
      template:
        ref: hello-ci-template
